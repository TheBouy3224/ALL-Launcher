name: Android CI

# ALL: disabled. Inherited from Zalith; it would build with a CI key and attach APKs to a GitHub release.
# ALL releases are built and signed locally with the private ALL key and uploaded by hand (see BUILDING-UBUNTU.md).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    if: ${{ false }}
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Organize Artifacts
        run: |
          mkdir -p ./apks
          
          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;
          
          echo "Found $(ls ./apks/ | wc -l) APK file(s)"

      - name: Upload To Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ./apks/*.apk
          fail_on_unmatched_files: true
